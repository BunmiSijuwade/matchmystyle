      <h1>MatchMyStyle: see a look you love? Shop it in your size.</h1>
      <p>Upload any outfit photo or paste a link. MatchMyStyle finds every piece in your size, with budget, mid-range and vintage options side by side.</p>
      <p>Upload a photo or paste a link to an outfit. MatchMyStyle identifies each piece (coat, top, trousers, shoes, bag, jewelry) and finds matches from real stores in your size, in three price ranges: budget, mid-range and luxury, plus vintage searches. A shopping concierge can build a look from a description, an occasion or an aesthetic such as Brownstone Minimal, Downtown Uniform, Off-Duty Muse or Gallery Hours.</p>
